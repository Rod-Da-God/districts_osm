# Запуск: pre-commit run --all-files
# Установка: pre-commit install && pre-commit install --hook-type pre-push

repos:
  # Базовые проверки
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of file
      - id: check-yaml
        name: Check YAML
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: Check for merge conflicts

  # Ruff: Линтинг + форматирование (очень быстро)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        name: Ruff lint
        args: [--fix, --exit-non-zero-on-fix, --show-fixes]
      - id: ruff-format
        name: Ruff format
        args: [--check]

  # MyPy: Типизация (локальный хук, pre-push)
  # language: system + прямой вызов интерпретатора venv — на Windows нет
  # рабочего sh/bash, поэтому shell-обёртки не используются.
  - repo: local
    hooks:
      - id: mypy
        name: MyPy type check
        entry: .venv/Scripts/python.exe -m mypy src
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

  # Pytest: ЮНИТ-тесты только (локальный хук, pre-push)
  # НЕ запускаем интеграционные тесты здесь!
  # pytest возвращает 5, если тесты не собраны — для хука это не ошибка.
  - repo: local
    hooks:
      - id: pytest-unit
        name: Pytest unit tests
        entry: .venv/Scripts/python.exe -m pytest tests/unit -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

default_stages: [pre-commit]
fail_fast: false
