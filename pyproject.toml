[tool.ruff]
output-format = "full"
line-length = 79
target-version = "py313"
exclude = [
    ".venv",
    "venv",
    "migrations",
    "tests",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "C4", "UP", "PYI"]

[tool.ruff.lint.isort]
lines-after-imports = 2
lines-between-types = 0

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
exclude = [
    ".venv",
    "venv",
    "migrations",
    "tests",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
python_version = "3.13"
explicit_package_bases = true
mypy_path = "src"
